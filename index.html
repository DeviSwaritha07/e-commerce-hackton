<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review Intelligence — customer review analytics and sentiment intelligence">
  <title>Review Intelligence | Customer Voice Analytics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">RI</div>
        <div>
          <strong>Review<span>IQ</span></strong>
          <small>Customer Voice Intelligence</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span> Overview</button>
        <button class="nav-item" data-page="reviews"><span>◫</span> Reviews Explorer</button>
        <button class="nav-item" data-page="predict"><span>✦</span> AI Predictor</button>
        <button class="nav-item" data-page="issues"><span>⚑</span> Issue Intelligence</button>
        <button class="nav-item" data-page="products"><span>◈</span> Product Watchlist</button>
        <button class="nav-item" data-page="model"><span>◎</span> Model & Method</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="data-status"><i></i><span>Local dataset loaded</span></div>
        <small>Frontend-only • No backend required</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <div class="eyebrow">CUSTOMER REVIEW ANALYTICS</div>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="top-actions">
          <span class="pill"><span class="dot"></span> Live local analysis</span>
        </div>
      </header>

      <section id="page-dashboard" class="page active"></section>
      <section id="page-reviews" class="page"></section>
      <section id="page-predict" class="page"></section>
      <section id="page-issues" class="page"></section>
      <section id="page-products" class="page"></section>
      <section id="page-model" class="page"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
